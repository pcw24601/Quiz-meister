<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quiz-Meister — Play</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/play.css">
</head>
<body class="play-body">

<!-- Join Screen -->
<div id="screen-join" class="screen active">
  <div class="join-container">
    <div class="join-logo">
      <span class="logo-icon">&#9670;</span>
      <h1>Quiz-Meister</h1>
    </div>
    <div class="card">
      <h2>Join Game</h2>
      <div class="form-group">
        <label for="join-session-id">Session ID</label>
        <input type="text" id="join-session-id" placeholder="Enter session ID..." autocomplete="off">
      </div>
      <div class="form-group">
        <label for="join-team-name">Team Name</label>
        <input type="text" id="join-team-name" placeholder="Your team name..." maxlength="30" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-lg" id="btn-join">Join Game</button>
      <div id="join-error" class="error-msg hidden"></div>
    </div>
  </div>
</div>

<!-- Waiting Screen -->
<div id="screen-waiting" class="screen">
  <div class="waiting-container">
    <div class="team-name-display" id="player-team-name">Team Name</div>
    <div class="waiting-pulse">
      <div class="pulse-ring"></div>
      <div class="pulse-dot"></div>
    </div>
    <h2>Waiting for the quiz to start</h2>
    <p id="waiting-round-name" class="muted"></p>
    <div class="team-count-display">
      <span id="waiting-team-count">0</span> teams joined
    </div>
  </div>
</div>

<!-- Question Screen -->
<div id="screen-question" class="screen">
  <div class="question-container">
    <div class="q-top-bar">
      <span id="play-round-label" class="round-chip">Round 1</span>
      <div class="play-timer" id="play-timer">
        <span id="play-timer-value">30</span>
      </div>
      <span id="play-q-label" class="q-chip">Q1</span>
    </div>

    <div id="play-question-image" class="play-question-image hidden">
      <img id="play-question-img" src="" alt="">
    </div>

    <div class="play-question-text" id="play-question-text"></div>

    <!-- Multiple choice / picture options -->
    <div id="play-options" class="play-options hidden"></div>

    <!-- Select many options -->
    <div id="play-select-many" class="play-select-many hidden">
      <p class="select-hint">Select all that apply</p>
      <div id="play-select-many-options" class="play-options multi"></div>
      <button class="btn btn-primary btn-submit" id="btn-submit-many">Submit Answers</button>
    </div>

    <!-- Order question -->
    <div id="play-order" class="play-order hidden">
      <p class="select-hint">Drag to reorder</p>
      <div id="play-order-list" class="order-list"></div>
      <button class="btn btn-primary btn-submit" id="btn-submit-order">Submit Order</button>
    </div>

    <!-- Numeric question -->
    <div id="play-numeric" class="play-numeric hidden">
      <input type="number" id="play-numeric-input" class="numeric-input" placeholder="Your answer...">
      <button class="btn btn-primary btn-submit" id="btn-submit-numeric">Submit</button>
    </div>

    <!-- First letter question -->
    <div id="play-first-letter" class="play-first-letter hidden">
      <p class="select-hint">Tap the first letter of the answer</p>
      <div id="letter-grid" class="letter-grid"></div>
    </div>

    <div id="play-submitted" class="submitted-state hidden">
      <div class="submitted-icon">&#10003;</div>
      <p>Answer submitted!</p>
      <p class="muted">Waiting for others...</p>
    </div>
  </div>
</div>

<!-- Reveal Screen -->
<div id="screen-reveal" class="screen">
  <div class="reveal-container">
    <h2>Answer Revealed</h2>
    <div id="reveal-question" class="reveal-q-text"></div>
    <div id="reveal-answer-display" class="reveal-answer-player"></div>
    <div id="reveal-your-answer" class="your-answer-display"></div>
    <div id="reveal-score-change" class="score-change hidden"></div>
  </div>
</div>

<!-- Leaderboard Screen -->
<div id="screen-leaderboard" class="screen">
  <div class="lb-container">
    <h2>&#127942; Leaderboard</h2>
    <div id="play-leaderboard" class="play-lb-list"></div>
    <div class="your-rank-display" id="your-rank-display"></div>
  </div>
</div>

<!-- Ended Screen -->
<div id="screen-ended" class="screen">
  <div class="ended-container">
    <div class="ended-trophy">&#127942;</div>
    <h2>Quiz Complete!</h2>
    <div id="play-final-lb" class="play-lb-list"></div>
  </div>
</div>

<script src="/static/js/play.js"></script>
</body>
</html>
