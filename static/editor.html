<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Editor — Quiz-Meister</title>
<link rel="stylesheet" href="/static/css/base.css">
<style>
:root {
  --editor-bg: #0f1117;
  --editor-sidebar: #161922;
  --editor-card: #1c1f2a;
  --editor-border: #2a2e3a;
  --editor-text: #e5e7eb;
  --editor-muted: #9ca3af;
  --primary-500: #3b82f6;
  --success-500: #22c55e;
  --danger-500: #ef4444;
  --warning-500: #f59e0b;
}

body {
  background: var(--editor-bg);
  color: var(--editor-text);
  font-family: 'Inter', -apple-system, sans-serif;
  margin: 0;
  min-height: 100vh;
}

.editor-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 60px 1fr;
  min-height: 100vh;
}

/* Header */
.editor-header {
  grid-column: 1 / -1;
  background: var(--editor-sidebar);
  border-bottom: 1px solid var(--editor-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}

.editor-header h1 {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

/* Sidebar */
.editor-sidebar {
  background: var(--editor-sidebar);
  border-right: 1px solid var(--editor-border);
  padding: 16px;
  overflow-y: auto;
}

.sidebar-section {
  margin-bottom: 20px;
}

.sidebar-section h3 {
  font-size: 0.75rem;
  text-transform: uppercase;
  color: var(--editor-muted);
  margin: 0 0 8px 0;
  letter-spacing: 0.5px;
}

.round-item {
  padding: 10px 12px;
  background: var(--editor-card);
  border: 1px solid var(--editor-border);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
}

.round-item:hover {
  border-color: var(--primary-500);
}

.round-item.active {
  border-color: var(--primary-500);
  background: rgba(59, 130, 246, 0.1);
}

.round-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.round-item-name {
  font-weight: 500;
}

.round-item-count {
  font-size: 0.75rem;
  color: var(--editor-muted);
}

.btn-add-round {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 2px dashed var(--editor-border);
  border-radius: 8px;
  color: var(--editor-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-add-round:hover {
  border-color: var(--primary-500);
  color: var(--primary-500);
}

/* Main content */
.editor-main {
  padding: 24px;
  overflow-y: auto;
}

.round-editor {
  max-width: 900px;
  margin: 0 auto;
}

.round-title-input {
  font-size: 1.75rem;
  font-weight: 700;
  background: transparent;
  border: none;
  color: var(--editor-text);
  width: 100%;
  padding: 8px 0;
  border-bottom: 2px solid transparent;
  margin-bottom: 24px;
}

.round-title-input:focus {
  outline: none;
  border-bottom-color: var(--primary-500);
}

.question-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.question-card {
  background: var(--editor-card);
  border: 1px solid var(--editor-border);
  border-radius: 12px;
  overflow: hidden;
}

.question-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--editor-border);
}

.question-number {
  font-weight: 600;
  color: var(--primary-500);
}

.question-type-select {
  padding: 6px 12px;
  background: var(--editor-bg);
  border: 1px solid var(--editor-border);
  border-radius: 6px;
  color: var(--editor-text);
  font-size: 0.875rem;
}

.question-actions {
  display: flex;
  gap: 8px;
}

.btn-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--editor-border);
  border-radius: 6px;
  color: var(--editor-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-icon:hover {
  background: var(--editor-bg);
  color: var(--editor-text);
}

.btn-icon.danger:hover {
  color: var(--danger-500);
  border-color: var(--danger-500);
}

.question-body {
  padding: 16px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 0.75rem;
  text-transform: uppercase;
  color: var(--editor-muted);
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea,
.form-group select {
  padding: 10px 12px;
  background: var(--editor-bg);
  border: 1px solid var(--editor-border);
  border-radius: 8px;
  color: var(--editor-text);
  font-size: 0.9rem;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--primary-500);
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
}

.options-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.option-row input {
  flex: 1;
}

.option-row input.correct {
  border-color: var(--success-500);
  background: rgba(34, 197, 94, 0.1);
}

.btn-add-option {
  padding: 8px 16px;
  background: transparent;
  border: 1px dashed var(--editor-border);
  border-radius: 6px;
  color: var(--editor-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-add-option:hover {
  border-color: var(--primary-500);
  color: var(--primary-500);
}

.btn-correct {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--editor-border);
  background: transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-correct.active {
  background: var(--success-500);
  border-color: var(--success-500);
}

.btn-correct.multiple.active {
  background: var(--success-500);
  border-color: var(--success-500);
}

.add-question-btn {
  width: 100%;
  padding: 20px;
  background: transparent;
  border: 2px dashed var(--editor-border);
  border-radius: 12px;
  color: var(--editor-muted);
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.15s;
}

.add-question-btn:hover {
  border-color: var(--primary-500);
  color: var(--primary-500);
}

/* Buttons */
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}

.btn-primary {
  background: var(--primary-500);
  color: white;
}

.btn-primary:hover {
  background: #2563eb;
}

.btn-secondary {
  background: var(--editor-card);
  border: 1px solid var(--editor-border);
  color: var(--editor-text);
}

.btn-secondary:hover {
  background: var(--editor-bg);
}

.btn-success {
  background: var(--success-500);
  color: white;
}

/* Helpers */
.hidden { display: none !important; }

/* Image Preview */
.image-field-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.image-preview-wrap {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.image-preview-thumb {
  width: 100px;
  height: 75px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--editor-border);
  background: var(--editor-bg);
  flex-shrink: 0;
  display: none;
}

.image-preview-thumb.visible {
  display: block;
}

.image-url-input-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.image-upload-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-upload {
  padding: 6px 12px;
  background: transparent;
  border: 1px dashed var(--editor-border);
  border-radius: 6px;
  color: var(--editor-muted);
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: all 0.15s;
}

.btn-upload:hover:not(:disabled) {
  border-color: var(--primary-500);
  color: var(--primary-500);
}

.btn-upload:disabled,
.btn-upload.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  border-color: var(--editor-border);
  color: var(--editor-muted);
}

.image-upload-hint {
  font-size: 0.75rem;
  color: var(--warning-500);
  display: block;
  margin-top: 2px;
}

.image-upload-status {
  font-size: 0.75rem;
  color: var(--editor-muted);
  min-height: 1em;
}

/* Round drag handle & reorder buttons */
.round-item {
  position: relative;
}

.round-drag-handle {
  cursor: grab;
  color: var(--editor-muted);
  padding: 2px 4px;
  font-size: 0.9rem;
  line-height: 1;
  user-select: none;
  flex-shrink: 0;
  opacity: 0.5;
  transition: opacity 0.15s;
}

.round-item:hover .round-drag-handle {
  opacity: 1;
}

.round-drag-handle:active {
  cursor: grabbing;
}

.round-item.dragging {
  opacity: 0.35;
  border-style: dashed;
}

.round-item.drag-over {
  border-color: var(--primary-500);
  box-shadow: 0 3px 0 0 var(--primary-500);
}

.round-move-btn {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--editor-border);
  border-radius: 4px;
  color: var(--editor-muted);
  cursor: pointer;
  font-size: 0.65rem;
  line-height: 1;
  transition: all 0.15s;
  flex-shrink: 0;
  padding: 0;
}

.round-move-btn:hover {
  background: var(--editor-bg);
  color: var(--editor-text);
  border-color: var(--primary-500);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--editor-muted);
}

.empty-state h2 {
  font-size: 1.5rem;
  color: var(--editor-text);
  margin-bottom: 8px;
}
</style>
</head>
<body>

<div class="editor-layout">
  <!-- Header -->
  <header class="editor-header">
    <h1><span style="color: var(--primary-500)">&#9670;</span> Quiz Editor</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-new">New</button>
      <button class="btn btn-secondary" id="btn-open">Open...</button>
      <button class="btn btn-secondary" id="btn-save-yaml">Save Local</button>
      <button class="btn btn-success" id="btn-save">Save</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="editor-sidebar">
    <div class="sidebar-section">
      <h3>Quiz Title</h3>
      <input type="text" id="quiz-title" placeholder="My Quiz Night" style="width:100%;padding:10px;background:var(--editor-card);border:1px solid var(--editor-border);border-radius:6px;color:var(--editor-text)">
    </div>

    <div class="sidebar-section">
      <h3>Rounds</h3>
      <div id="round-list"></div>
      <button class="btn-add-round" id="btn-add-round">+ Add Round</button>
    </div>
  </aside>

  <!-- Main Editor -->
  <main class="editor-main">
    <div id="round-editor" class="round-editor hidden">
      <input type="text" id="round-name" class="round-title-input" placeholder="Round Name">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">
        <div>
          <label style="display:block;color:var(--editor-muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Round Instructions (optional)</label>
          <textarea id="round-instructions" placeholder="Introduce this round to players..." style="width:100%;background:var(--editor-card);border:1px solid var(--editor-border);border-radius:6px;color:var(--editor-text);padding:8px 12px;height:80px;resize:vertical;font-family:inherit;font-size:0.9rem;outline:none"></textarea>
        </div>
        <div>
          <label style="display:block;color:var(--editor-muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Round Image (optional)</label>
          <div class="image-preview-wrap">
            <img id="round-img-preview" class="image-preview-thumb" src="" alt="Round Preview">
            <div class="image-url-input-wrap">
              <div class="image-upload-row">
                <input type="text" id="round-image" placeholder="e.g. images/round_geography.jpg" style="flex:1;background:var(--editor-card);border:1px solid var(--editor-border);border-radius:6px;color:var(--editor-text);padding:8px 12px;font-family:inherit;font-size:0.9rem;outline:none">
                <button type="button" class="btn-upload" id="btn-upload-round-img" onclick="triggerRoundImageUpload()">⬆ Upload...</button>
              </div>
              <span class="image-upload-status" id="round-img-status"></span>
            </div>
          </div>
        </div>
      </div>
      <div id="question-list" class="question-list"></div>
      <button class="add-question-btn" id="btn-add-question">+ Add Question</button>
    </div>
    <div id="empty-state" class="empty-state">
      <h2>No Round Selected</h2>
      <p>Select a round from the sidebar or create a new one to get started.</p>
    </div>
  </main>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────

let quiz = {
  title: 'My Quiz Night',
  rounds: []
};
let activeRoundIndex = -1;
let currentFilename = '';
let currentQuizPath = '';

function getEditorImageUrl(src) {
  if (!src) return '';
  const s = String(src).trim();
  if (s.startsWith('http://') || s.startsWith('https://') || s.startsWith('data:') || s.startsWith('/quiz-images/') || s.startsWith('/static/')) {
    return s;
  }
  if (currentQuizPath) {
    return `/api/quizzes/image?quiz_file=${encodeURIComponent(currentQuizPath)}&path=${encodeURIComponent(s)}`;
  }
  return s;
}

// ── Renderers ────────────────────────────────────────────────────────────────

function renderSidebar() {
  const list = document.getElementById('round-list');
  list.innerHTML = quiz.rounds.map((r, i) => `
    <div class="round-item ${i === activeRoundIndex ? 'active' : ''}"
         draggable="true"
         onclick="selectRound(${i})"
         ondragstart="roundDragStart(event, ${i})"
         ondragover="roundDragOver(event, ${i})"
         ondrop="roundDrop(event, ${i})"
         ondragend="roundDragEnd(event)"
         data-round-index="${i}">
      <div class="round-item-header">
        <span class="round-drag-handle" title="Drag to reorder">⠿</span>
        <span class="round-item-name">${r.name || 'Untitled Round'}</span>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <span class="round-item-count">${r.questions.length}q</span>
          <button type="button" class="round-move-btn" onclick="event.stopPropagation(); moveRound(${i}, -1)" title="Move round up">▲</button>
          <button type="button" class="round-move-btn" onclick="event.stopPropagation(); moveRound(${i}, 1)" title="Move round down">▼</button>
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('quiz-title').value = quiz.title;
}

function renderRoundEditor() {
  if (activeRoundIndex < 0 || activeRoundIndex >= quiz.rounds.length) {
    document.getElementById('round-editor').classList.add('hidden');
    document.getElementById('empty-state').classList.remove('hidden');
    return;
  }

  document.getElementById('round-editor').classList.remove('hidden');
  document.getElementById('empty-state').classList.add('hidden');

  const round = quiz.rounds[activeRoundIndex];
  document.getElementById('round-name').value = round.name;
  document.getElementById('round-instructions').value = round.instructions || '';
  document.getElementById('round-image').value = round.image || '';
  updateRoundImagePreview(round.image || '');

  const isSaved = Boolean(currentQuizPath);
  const roundUploadBtn = document.getElementById('btn-upload-round-img');
  if (roundUploadBtn) {
    roundUploadBtn.disabled = !isSaved;
    roundUploadBtn.title = isSaved ? 'Upload an image for this round' : 'Save quiz to server first to enable image upload';
  }
  const roundHint = document.getElementById('round-img-status');
  if (roundHint) {
    roundHint.innerHTML = !isSaved ? '<span class="image-upload-hint">Save quiz to server to enable upload</span>' : '';
  }

  renderQuestions();
}

function renderQuestions() {
  const round = quiz.rounds[activeRoundIndex];
  const list = document.getElementById('question-list');

  list.innerHTML = round.questions.map((q, i) => renderQuestionCard(q, i)).join('');
}

function renderQuestionCard(q, idx) {
  const typeOptions = ['multiple_choice', 'select_many', 'order', 'numeric', 'picture', 'first_letter']
    .map(t => `<option value="${t}" ${q.type === t ? 'selected' : ''}>${formatType(t)}</option>`)
    .join('');

  let extraFields = '';

  if (['multiple_choice', 'picture', 'select_many'].includes(q.type)) {
    const isMultiple = q.type === 'select_many';
    extraFields = `
      <div class="form-group full">
        <label>Options ${isMultiple ? '(check all correct answers)' : '(select the correct one)'}</label>
        <div class="options-container">
          ${(q.options || []).map((opt, oi) => `
            <div class="option-row">
              <button type="button" class="btn-correct ${isMultiple ? 'multiple' : ''} ${(isMultiple ? q.correct.includes(oi) : q.correct === oi) ? 'active' : ''}"
                      onclick="toggleCorrect(${idx}, ${oi})" title="Mark as correct"></button>
              <input type="text" value="${escapeHtml(opt)}" oninput="updateOption(${idx}, ${oi}, this.value)"
                     class="${(isMultiple ? q.correct.includes(oi) : q.correct === oi) ? 'correct' : ''}">
              <button type="button" class="btn-icon danger" onclick="removeOption(${idx}, ${oi})" title="Remove option">x</button>
            </div>
          `).join('')}
          <button type="button" class="btn-add-option" onclick="addOption(${idx})">+ Add Option</button>
        </div>
      </div>
    `;
  }

  if (q.type === 'order') {
    extraFields = `
      <div class="form-group full">
        <label>Items (in correct order)</label>
        <div class="options-container">
          ${(q.items || []).map((item, oi) => `
            <div class="option-row">
              <span style="color:var(--editor-muted);width:24px">${oi + 1}.</span>
              <input type="text" value="${escapeHtml(item)}" oninput="updateOrderItem(${idx}, ${oi}, this.value)">
              <button type="button" class="btn-icon danger" onclick="removeOrderItem(${idx}, ${oi})" title="Remove">x</button>
            </div>
          `).join('')}
          <button type="button" class="btn-add-option" onclick="addOrderItem(${idx})">+ Add Item</button>
        </div>
      </div>
    `;
  }

  if (q.type === 'numeric') {
    extraFields = `
      <div class="form-group">
        <label>Correct Answer</label>
        <input type="number" value="${q.answer || 0}" oninput="updateQuestion(${idx}, 'answer', parseFloat(this.value))">
      </div>
      <div class="form-group">
        <label>Tolerance (optional)</label>
        <input type="number" value="${q.tolerance || 0}" oninput="updateQuestion(${idx}, 'tolerance', parseFloat(this.value))">
      </div>
    `;
  }

  if (q.type === 'first_letter') {
    extraFields = `
      <div class="form-group">
        <label>Correct First Letter</label>
        <input type="text" maxlength="1" value="${q.answer || 'A'}" oninput="updateQuestion(${idx}, 'answer', this.value.toUpperCase())" style="text-transform:uppercase">
      </div>
    `;
  }

  // Answer info (optional) and image can be added to any question type
  const isSaved = Boolean(currentQuizPath);
  const uploadDisabled = !isSaved ? 'disabled' : '';
  const uploadTitle = !isSaved ? 'title="Save quiz to server first to enable image upload"' : '';
  const uploadHint = !isSaved ? '<span class="image-upload-hint">Save quiz to server to enable upload</span>' : '';
  const imgThumbStyle = q.image ? 'class="image-preview-thumb visible"' : 'class="image-preview-thumb"';
  const resolvedImgSrc = getEditorImageUrl(q.image || '');

  extraFields += `
    <div class="form-group full">
      <label>Answer Info (optional)</label>
      <textarea oninput="updateQuestion(${idx}, 'answer_info', this.value)">${escapeHtml(q.answer_info || '')}</textarea>
    </div>
    <div class="form-group full image-field-group">
      <label>Image (optional)</label>
      <div class="image-preview-wrap">
        <img id="img-preview-${idx}" ${imgThumbStyle} src="${escapeHtml(resolvedImgSrc)}" alt="Preview">
        <div class="image-url-input-wrap">
          <div class="image-upload-row">
            <input type="text" id="img-url-${idx}" value="${escapeHtml(q.image || '')}" placeholder="e.g. images/photo.jpg or https://..."
                   oninput="updateQuestion(${idx}, 'image', this.value); updateImagePreview(${idx}, this.value)" style="flex:1">
            <button type="button" class="btn-upload" ${uploadDisabled} ${uploadTitle} onclick="triggerImageUpload(${idx})">⬆ Upload...</button>
          </div>
          <span class="image-upload-status" id="img-status-${idx}">${uploadHint}</span>
        </div>
      </div>
    </div>
  `;

  return `
    <div class="question-card" data-index="${idx}">
      <div class="question-card-header">
        <span class="question-number">Q${idx + 1}</span>
        <select class="question-type-select" onchange="changeQuestionType(${idx}, this.value)">
          ${typeOptions}
        </select>
        <div class="question-actions">
          <button type="button" class="btn-icon" onclick="moveQuestion(${idx}, -1)" title="Move up">u</button>
          <button type="button" class="btn-icon" onclick="moveQuestion(${idx}, 1)" title="Move down">d</button>
          <button type="button" class="btn-icon danger" onclick="deleteQuestion(${idx})" title="Delete">x</button>
        </div>
      </div>
      <div class="question-body">
        <div class="form-row">
          <div class="form-group full">
            <label>Question Text</label>
            <textarea oninput="updateQuestion(${idx}, 'text', this.value)">${escapeHtml(q.text || '')}</textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Time (seconds)</label>
            <input type="number" value="${q.time || 30}" oninput="updateQuestion(${idx}, 'time', parseInt(this.value))">
          </div>
          <div class="form-group">
            <label>Points</label>
            <input type="number" value="${q.points || 1}" oninput="updateQuestion(${idx}, 'points', parseInt(this.value))">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Tiebreaker?</label>
            <select onchange="updateQuestion(${idx}, 'tiebreaker', this.value === 'true')">
              <option value="false" ${!q.tiebreaker ? 'selected' : ''}>No</option>
              <option value="true" ${q.tiebreaker ? 'selected' : ''}>Yes</option>
            </select>
          </div>
        </div>
        ${extraFields}
      </div>
    </div>
  `;
}

function formatType(t) {
  return {
    multiple_choice: 'Multiple Choice',
    select_many: 'Select Many',
    order: 'Put in Order',
    numeric: 'Numeric',
    picture: 'Picture Round',
    first_letter: 'First Letter'
  }[t] || t;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Round Reordering ──────────────────────────────────────────────────────────

function moveRound(idx, direction) {
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= quiz.rounds.length) return;
  [quiz.rounds[idx], quiz.rounds[newIdx]] = [quiz.rounds[newIdx], quiz.rounds[idx]];
  // Keep the active selection on the same round after move
  if (activeRoundIndex === idx) {
    activeRoundIndex = newIdx;
  } else if (activeRoundIndex === newIdx) {
    activeRoundIndex = idx;
  }
  renderSidebar();
  renderRoundEditor();
}

let _dragSrcIndex = -1;

function roundDragStart(event, idx) {
  _dragSrcIndex = idx;
  event.dataTransfer.effectAllowed = 'move';
  // Slight delay so the browser captures the snapshot before we dim the element
  setTimeout(() => {
    const el = document.querySelector(`.round-item[data-round-index="${idx}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function roundDragOver(event, idx) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.round-item').forEach(el => el.classList.remove('drag-over'));
  if (idx !== _dragSrcIndex) {
    event.currentTarget.classList.add('drag-over');
  }
}

function roundDrop(event, targetIdx) {
  event.preventDefault();
  if (_dragSrcIndex === -1 || _dragSrcIndex === targetIdx) return;

  const moved = quiz.rounds.splice(_dragSrcIndex, 1)[0];
  quiz.rounds.splice(targetIdx, 0, moved);

  // Adjust activeRoundIndex so the same round stays selected
  if (activeRoundIndex === _dragSrcIndex) {
    activeRoundIndex = targetIdx;
  } else if (_dragSrcIndex < activeRoundIndex && targetIdx >= activeRoundIndex) {
    activeRoundIndex--;
  } else if (_dragSrcIndex > activeRoundIndex && targetIdx <= activeRoundIndex) {
    activeRoundIndex++;
  }

  _dragSrcIndex = -1;
  renderSidebar();
  renderRoundEditor();
}

function roundDragEnd(event) {
  _dragSrcIndex = -1;
  document.querySelectorAll('.round-item').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
}

function addQuestion() {
  const round = quiz.rounds[activeRoundIndex];
  round.questions.push({
    type: 'multiple_choice',
    text: '',
    time: 30,
    points: 1,
    tiebreaker: false,
    options: ['', '', '', ''],
    correct: 0,
    answer_info: ''
  });
  renderQuestions();
}

function deleteQuestion(idx) {
  if (!confirm('Delete this question?')) return;
  quiz.rounds[activeRoundIndex].questions.splice(idx, 1);
  renderQuestions();
}

function moveQuestion(idx, direction) {
  const questions = quiz.rounds[activeRoundIndex].questions;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= questions.length) return;
  [questions[idx], questions[newIdx]] = [questions[newIdx], questions[idx]];
  renderQuestions();
}

function changeQuestionType(idx, newType) {
  const q = quiz.rounds[activeRoundIndex].questions[idx];
  const base = { type: newType, text: q.text, time: q.time, points: q.points, tiebreaker: q.tiebreaker, image: q.image || '', answer_info: q.answer_info || '' };

  if (newType === 'multiple_choice' || newType === 'picture') {
    base.options = q.options || ['', '', '', ''];
    // Preserve correct if coming from a compatible type
    if (q.type === 'multiple_choice' || q.type === 'picture') {
      base.correct = q.correct || 0;
    } else if (q.type === 'select_many' && q.correct && q.correct.length > 0) {
      base.correct = q.correct[0]; // Use first correct as single correct
    } else {
      base.correct = 0;
    }
  } else if (newType === 'select_many') {
    base.options = q.options || ['', '', '', ''];
    // Preserve correct if coming from a compatible type
    if (q.type === 'select_many') {
      base.correct = q.correct || [];
    } else if ((q.type === 'multiple_choice' || q.type === 'picture') && q.correct !== undefined) {
      base.correct = [q.correct]; // Convert single to array
    } else {
      base.correct = [];
    }
  } else if (newType === 'order') {
    base.items = q.items || ['', '', ''];
  } else if (newType === 'numeric') {
    base.answer = q.answer || 0;
    base.tolerance = q.tolerance || 0;
  } else if (newType === 'first_letter') {
    base.answer = q.answer || 'A';
  }

  quiz.rounds[activeRoundIndex].questions[idx] = base;
  renderQuestions();
}

function updateQuestion(idx, field, value) {
  quiz.rounds[activeRoundIndex].questions[idx][field] = value;
}

function addOption(qIdx) {
  const q = quiz.rounds[activeRoundIndex].questions[qIdx];
  if (!q.options) q.options = [];
  q.options.push('');
  if (q.type === 'select_many' && !q.correct) q.correct = [];
  renderQuestions();
}

function removeOption(qIdx, oIdx) {
  const q = quiz.rounds[activeRoundIndex].questions[qIdx];
  q.options.splice(oIdx, 1);
  // Adjust correct index after removal
  if (q.type === 'select_many') {
    if (!q.correct) q.correct = [];
    q.correct = q.correct
      .filter(c => c !== oIdx)
      .map(c => c > oIdx ? c - 1 : c);
  } else {
    if (q.correct === oIdx) {
      q.correct = 0; // Reset if removed option was correct
    } else if (q.correct > oIdx) {
      q.correct--; // Shift down if correct was after removed
    }
  }
  renderQuestions();
}

function updateOption(qIdx, oIdx, value) {
  quiz.rounds[activeRoundIndex].questions[qIdx].options[oIdx] = value;
}

function toggleCorrect(qIdx, oIdx) {
  const q = quiz.rounds[activeRoundIndex].questions[qIdx];
  if (q.type === 'select_many') {
    if (!q.correct) q.correct = [];
    const pos = q.correct.indexOf(oIdx);
    if (pos >= 0) q.correct.splice(pos, 1);
    else q.correct.push(oIdx);
    q.correct.sort((a, b) => a - b);
  } else {
    q.correct = oIdx;
  }
  renderQuestions();
}

function addOrderItem(qIdx) {
  const q = quiz.rounds[activeRoundIndex].questions[qIdx];
  if (!q.items) q.items = [];
  q.items.push('');
  renderQuestions();
}

function removeOrderItem(qIdx, iIdx) {

function updateOrderItem(qIdx, iIdx, value) {

}

async function resizeAndCompressImage(file, maxWidth = 800, maxHeight = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        // Scale down proportionally
        if (width > maxWidth || height > maxHeight) {
          const scale = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed'));
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageUpload(qIdx, file) {
  if (!currentQuizPath) {
    showToast('Please save the quiz to the server first.');
    return;
  }
  const statusEl = document.getElementById(`img-status-${qIdx}`);
  if (statusEl) statusEl.textContent = 'Compressing...';

  try {
    const compressed = await resizeAndCompressImage(file);
    const sizeKB = Math.round(compressed.size / 1024);
    if (statusEl) statusEl.textContent = `Uploading (${sizeKB}KB)...`;

    const formData = new FormData();
    formData.append('file', compressed, file.name.replace(/\.[^.]+$/, '.jpg'));
    formData.append('quiz_file', currentQuizPath);
    formData.append('original_filename', file.name);   // preserve original name on server

    const res = await fetch('/api/quizzes/upload-image', { method: 'POST', body: formData });
    const data = await res.json();

    if (!data.ok) throw new Error(data.detail || 'Upload failed');

    // Update state and UI
    quiz.rounds[activeRoundIndex].questions[qIdx].image = data.path;
    const urlInput = document.getElementById(`img-url-${qIdx}`);
    if (urlInput) urlInput.value = data.path;
    updateImagePreview(qIdx, data.path);
    if (statusEl) statusEl.textContent = `Saved locally (${sizeKB}KB)`;
  } catch (err) {
    if (statusEl) statusEl.textContent = `Error: ${err.message}`;
  }
}

  async function mirrorToServer(content, fname) {

    try {
      const res = await fetch('/api/quizzes/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: fname, content })
      });
      const data = await res.json();
      if (data.ok) {
        currentFilename = data.filename;
        currentQuizPath = data.path;
        renderRoundEditor();   // refresh to enable upload buttons
      }

  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
          description: 'YAML Files',
          accept: { 'text/yaml': ['.yaml', '.yml'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(yaml);
      await writable.close();
      await mirrorToServer(yaml, handle.name || filename);
      showToast('Quiz saved!');
      return;

      if (e.name === 'AbortError') return;

  downloadYAML(yaml, filename);
  await mirrorToServer(yaml, filename);
});

function escapeYamlStr(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\r\n/g, '\\n')
    .replace(/\r/g, '\\n')
    .replace(/\n/g, '\\n')
    .replace(/\t/g, '\\t');
}

function unescapeYamlValue(val) {
  if (val === null || val === undefined) return '';
  val = val.trim();
  if (!val) return '';

  if (val.startsWith('"') && val.endsWith('"') && val.length >= 2) {
    const inner = val.slice(1, -1);
    return inner
      .replace(/\\\\/g, '\0')
      .replace(/\\"/g, '"')
      .replace(/\\n/g, '\n')
      .replace(/\\r/g, '\r')
      .replace(/\\t/g, '\t')
      .replace(/\0/g, '\\');
  }

  if (val.startsWith("'") && val.endsWith("'") && val.length >= 2) {
    const inner = val.slice(1, -1);
    return inner.replace(/''/g, "'");
  }

  if (val.includes('\\"') || val.includes('\\\\')) {
    val = val.replace(/\\{2,}"/g, '"').replace(/\\"/g, '"');
  }

  return val;
}

function generateYAML() {
  let yaml = `title: "${escapeYamlStr(quiz.title || 'Quiz')}"\n\nrounds:\n`;

  for (const round of quiz.rounds) {
    yaml += `  - name: "${escapeYamlStr(round.name || 'Round')}"\n`;
    if (round.instructions) yaml += `    instructions: "${escapeYamlStr(round.instructions)}"\n`;
    if (round.image) yaml += `    image: "${escapeYamlStr(round.image)}"\n`;
    yaml += `    questions:\n`;

    for (const q of round.questions) {
      yaml += `      - type: ${q.type}\n`;
      yaml += `        text: "${escapeYamlStr(q.text || '')}"\n`;

      if (q.time !== 30 && q.time !== undefined && q.time !== null) yaml += `        time: ${q.time}\n`;
      if (q.points !== 1 && q.points !== undefined && q.points !== null) yaml += `        points: ${q.points}\n`;
      if (q.tiebreaker) yaml += `        tiebreaker: true\n`;

      if (q.type === 'multiple_choice' || q.type === 'picture' || q.type === 'select_many') {
        yaml += `        options:\n`;
        for (const opt of q.options || []) {
          yaml += `          - "${escapeYamlStr(opt || '')}"\n`;
        }
        if (q.type === 'select_many') {
          yaml += `        correct: [${(q.correct || []).join(', ')}]\n`;
        } else {
          yaml += `        correct: ${q.correct !== undefined && q.correct !== null ? q.correct : 0}\n`;
        }
      }

      if (q.image) {
        yaml += `        image: "${escapeYamlStr(q.image)}"\n`;
      }

      if (q.type === 'order') {
        yaml += `        items:\n`;
        for (const item of q.items || []) {
          yaml += `          - "${escapeYamlStr(item || '')}"\n`;
        }
      }

      if (q.type === 'numeric') {
        yaml += `        answer: ${q.answer !== undefined && q.answer !== null ? q.answer : 0}\n`;
        if (q.tolerance !== undefined && q.tolerance !== null && q.tolerance !== '') yaml += `        tolerance: ${q.tolerance}\n`;
      }

      if (q.type === 'first_letter') {
        yaml += `        answer: ${escapeYamlStr(q.answer || 'A')}\n`;
        if (q.note) yaml += `        note: "${escapeYamlStr(q.note)}"\n`;
      }

      if (q.answer_info) yaml += `        answer_info: "${escapeYamlStr(q.answer_info)}"\n`;
    }
  }

  return yaml;
}

function parseYAML(text) {
  const lines = text.split(/\r?\n/);
  quiz = { title: 'Quiz', rounds: [] };
  let currentRound = null;
  let currentQuestion = null;
  let inOptions = false;
  let inItems = false;

  function readValue(valStr, currentIndent, lineIdxRef) {
    let val = valStr.trim();
    if (val === '|' || val === '|-' || val === '>' || val === '>-') {
      const blockLines = [];
      lineIdxRef.i++;
      while (lineIdxRef.i < lines.length) {
        const nextRaw = lines[lineIdxRef.i];
        const nextTrimmed = nextRaw.trim();
        if (!nextTrimmed) {
          blockLines.push('');
          lineIdxRef.i++;
          continue;
        }
        const nextIndent = nextRaw.search(/\S|$/);
        if (nextIndent <= currentIndent) {
          lineIdxRef.i--;
          break;
        }
        blockLines.push(nextTrimmed);
        lineIdxRef.i++;
      }
      return blockLines.join('\n');
    }

    if (val.startsWith('"') && (!val.endsWith('"') || val.length === 1 || (val.endsWith('\\"') && !val.endsWith('\\\\"')))) {
      const quotedParts = [val];
      lineIdxRef.i++;
      while (lineIdxRef.i < lines.length) {
        const nextRaw = lines[lineIdxRef.i];
        const nextTrimmed = nextRaw.trim();
        quotedParts.push(nextTrimmed);
        if (nextTrimmed.endsWith('"') && !nextTrimmed.endsWith('\\"')) {
          break;
        }
        lineIdxRef.i++;
      }
      return unescapeYamlValue(quotedParts.join('\n'));
    }

    if (val.startsWith("'") && (!val.endsWith("'") || val.length === 1)) {
      const quotedParts = [val];
      lineIdxRef.i++;
      while (lineIdxRef.i < lines.length) {
        const nextRaw = lines[lineIdxRef.i];
        const nextTrimmed = nextRaw.trim();
        quotedParts.push(nextTrimmed);
        if (nextTrimmed.endsWith("'") && !nextTrimmed.endsWith("''")) {
          break;
        }
        lineIdxRef.i++;
      }
      return unescapeYamlValue(quotedParts.join('\n'));
    }

    return unescapeYamlValue(val);
  }

  const lineIdxRef = { i: 0 };
  while (lineIdxRef.i < lines.length) {
    const rawLine = lines[lineIdxRef.i];
    const line = rawLine.trim();
    const indent = rawLine.search(/\S|$/);

    if (!line || line.startsWith('#')) {
      lineIdxRef.i++;
      continue;
    }

    if (line.startsWith('title:')) {
      quiz.title = readValue(line.slice(6), indent, lineIdxRef);
    } else if (line.startsWith('- name:')) {
      currentRound = {
        name: readValue(line.slice(7), indent, lineIdxRef),
        instructions: '',
        image: '',
        questions: []
      };
      quiz.rounds.push(currentRound);
      currentQuestion = null;
      inOptions = false;
      inItems = false;
    } else if (currentRound && !currentQuestion && line.startsWith('instructions:')) {
      currentRound.instructions = readValue(line.slice(13), indent, lineIdxRef);
    } else if (currentRound && !currentQuestion && line.startsWith('image:')) {
      currentRound.image = readValue(line.slice(6), indent, lineIdxRef);
    } else if (line.startsWith('- type:')) {
      if (currentRound) {
        currentQuestion = {
          type: line.slice(7).trim(),
          text: '',
          time: 30,
          points: 1,
          tiebreaker: false,
          answer_info: ''
        };
        currentRound.questions.push(currentQuestion);
        inOptions = false;
        inItems = false;
      }
    } else if (currentQuestion) {
      if (line.startsWith('text:')) {
        currentQuestion.text = readValue(line.slice(5), indent, lineIdxRef);
        inOptions = inItems = false;
      } else if (line.startsWith('time:')) {
        const num = parseInt(line.slice(5).trim());
        if (!isNaN(num)) currentQuestion.time = num;
        inOptions = inItems = false;
      } else if (line.startsWith('points:')) {
        const num = parseInt(line.slice(7).trim());
        if (!isNaN(num)) currentQuestion.points = num;
        inOptions = inItems = false;
      } else if (line.startsWith('tiebreaker:')) {
        currentQuestion.tiebreaker = line.toLowerCase().includes('true');
        inOptions = inItems = false;
      } else if (line.startsWith('correct:')) {
        const val = line.slice(8).trim();
        if (val.startsWith('[')) {
          currentQuestion.correct = val.slice(1, -1).split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        } else {
          const num = parseInt(val);
          currentQuestion.correct = isNaN(num) ? 0 : num;
        }
        inOptions = inItems = false;
      } else if (line.startsWith('answer:')) {
        const val = readValue(line.slice(7), indent, lineIdxRef);
        currentQuestion.answer = (val !== '' && !isNaN(val)) ? parseFloat(val) : val;
        inOptions = inItems = false;
      } else if (line.startsWith('tolerance:')) {
        const num = parseFloat(line.slice(10).trim());
        if (!isNaN(num)) currentQuestion.tolerance = num;
        inOptions = inItems = false;
      } else if (line.startsWith('answer_info:') || line.startsWith('answerInfo:') || line.startsWith('explanation:') || line.startsWith('explain:') || line.startsWith('info:')) {
        const colonPos = line.indexOf(':');
        currentQuestion.answer_info = readValue(line.slice(colonPos + 1), indent, lineIdxRef);
        inOptions = inItems = false;
      } else if (line.startsWith('note:')) {
        const val = readValue(line.slice(5), indent, lineIdxRef);
        if (currentQuestion.type === 'first_letter') {
          currentQuestion.note = val;
        } else {
          if (!currentQuestion.answer_info) currentQuestion.answer_info = val;
        }
        inOptions = inItems = false;
      } else if (line.startsWith('image:')) {
        currentQuestion.image = readValue(line.slice(6), indent, lineIdxRef);
        inOptions = inItems = false;
      } else if (line.startsWith('options:')) {
        currentQuestion.options = [];
        inOptions = true;
        inItems = false;
      } else if (line.startsWith('items:')) {
        currentQuestion.items = [];
        inItems = true;
        inOptions = false;
      } else if (inOptions && line.startsWith('- ')) {
        currentQuestion.options.push(readValue(line.slice(2), indent, lineIdxRef));
      } else if (inItems && line.startsWith('- ')) {
        currentQuestion.items.push(readValue(line.slice(2), indent, lineIdxRef));
      } else if (!line.startsWith('- ')) {
        inOptions = inItems = false;
      }
    }
    lineIdxRef.i++;
  }

  // Ensure answer_info defaults to string
  for (const rd of quiz.rounds) {
    for (const q of rd.questions) {
      if (!q.answer_info) {
        if (q.answerInfo) q.answer_info = q.answerInfo;
        else if (q.explanation) q.answer_info = q.explanation;
        else if (q.explain) q.answer_info = q.explain;
        else if (q.info) q.answer_info = q.info;
        else if (q.note && q.type !== 'first_letter') q.answer_info = q.note;
      }
      if (!q.answer_info) q.answer_info = '';
    }
  }
}

// ── Initialize ──────────────────────────────────────────────────────────────

async function initEditor() {
  const params = new URLSearchParams(window.location.search);
  const fileParam = params.get('file');
  if (fileParam) {
    try {
      const res = await fetch(`/api/quizzes/load?file=${encodeURIComponent(fileParam)}`);
      if (res.ok) {
        const data = await res.json();
        currentFilename = data.filename;
        currentQuizPath = data.path;
        parseYAML(data.content);
        activeRoundIndex = 0;
        renderSidebar();
        renderRoundEditor();
        showToast(`Loaded ${data.filename}`);
        return;
      }
    } catch(e) {
      console.error(e);
    }
  }
  renderSidebar();
  renderRoundEditor();
}

initEditor();
</script>
